<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda - Contacto y Suscripción</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/open-iconic/1.1.1/font/css/open-iconic-bootstrap.min.css">
</head>
<body style="padding-top: 70px;">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
        <a class="navbar-brand" href="index.html">
            <span class="oi oi-globe mr-2"></span>Mi Tienda Web
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="productos.html">Catálogo</a></li>
                <li class="nav-item active"><a class="nav-link" href="contacto.html">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-3">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
                <li class="breadcrumb-item active" aria-current="page">Contacto y Suscripción</li>
            </ol>
        </nav>
    </div>

    <main class="container my-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <h2 class="mb-3 text-center">Formulario de Contacto</h2>
                    <p class="text-muted text-center mb-4">Déjanos tus comentarios, consultas o suscríbete a nuestras ofertas exclusivas.</p>
                    
                    <form>
                        <div class="form-group">
                            <label for="nombreCompleto" class="font-weight-bold">Nombre completo:</label>
                            <input type="text" class="form-control" id="nombreCompleto" placeholder="Ej. Ana Gómez" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="correoElectronico" class="font-weight-bold">Correo electrónico:</label>
                            <input type="email" class="form-control" id="correoElectronico" placeholder="nombre@ejemplo.com" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="motivoContacto" class="font-weight-bold">Motivo de contacto:</label>
                            <select class="form-control" id="motivoContacto">
                                <option>Consulta sobre un producto</option>
                                <option>Soporte técnico o garantía</option>
                                <option>Suscripción al boletín de ofertas</option>
                                <option>Comentarios y sugerencias</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="mensajeComentario" class="font-weight-bold">Comentario o Mensaje:</label>
                            <textarea class="form-control" id="mensajeComentario" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
                        </div>
                        
                        <div class="form-group form-check mb-4">
                            <input type="checkbox" class="form-check-input" id="terminosCheckbox" required>
                            <label class="form-check-label" for="terminosCheckbox">Acepto los términos, condiciones y la política de privacidad del sitio.</label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block py-2 font-weight-bold">Enviar Mensaje</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">Proyecto Módulo 2 - Bootstrap | Todos los derechos reservados</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
